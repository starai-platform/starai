name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: starai-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: |
            services/api/go.sum
            services/worker/go.sum

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify migration pairs
        run: node scripts/verify-migrations.js

      - name: Verify UI translation catalog
        run: |
          node scripts/sync-ui-translation-catalog.js --check
          node scripts/check-ui-hardcodes.js --check

      - name: Validate deployment files
        run: |
          bash -n scripts/deploy-prod.sh
          STARAI_ENV_FILE=../../.env.example docker compose --env-file .env.example -f infra/docker/docker-compose.prod.yml --profile search config --quiet
          docker compose --env-file .env.local -f infra/docker/docker-compose.yml --profile search config --quiet

      - name: Test and vet API
        working-directory: services/api
        env:
          TASK_READ_TEST_DATABASE_URL: postgres://postgres:starai-ci-only@localhost:5432/postgres?sslmode=disable
          I18N_TEST_DATABASE_URL: postgres://postgres:starai-ci-only@localhost:5432/postgres?sslmode=disable
        run: |
          go test ./...
          go vet ./...

      - name: Test and vet Worker
        working-directory: services/worker
        run: |
          go test ./...
          go vet ./...

      - name: Lint frontend
        run: pnpm -r lint

      - name: Test frontend request lifecycle
        run: node --experimental-strip-types --test apps/web/src/lib/api-cache.test.mjs apps/web/src/lib/pollAsync.test.mjs

      - name: Test translations and canvas workflow
        run: node --experimental-strip-types --test apps/web/src/i18n/translation.test.mjs apps/web/src/i18n/I18nProvider.test.mjs apps/web/src/components/workbench/canvasIntegrity.test.mjs apps/web/src/components/workbench/videoCreationWorkflow.test.mjs apps/web/src/components/workbench/canvasMediaUI.test.mjs apps/web/src/components/workbench/creativeAgentWorkflow.test.mjs apps/web/src/components/workbench/creativeAgentHistory.test.mjs

      - name: Build frontend
        run: |
          pnpm build:web
          pnpm build:admin
