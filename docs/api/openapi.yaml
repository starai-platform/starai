openapi: 3.1.0
info:
  title: StarAI Public API
  version: 1.0.0
  description: OpenAI-compatible chat API plus async-first image, video and audio task APIs. Media endpoints can wait synchronously when wait=true or response_format=sync; models whose configured poll budget exceeds 10 minutes return an async task instead. Reference video and audio URLs must be publicly reachable by the upstream provider.
servers:
  - url: https://api.your-starai-domain.com
security:
  - bearerAuth: []
tags:
  - name: Chat & Text
  - name: Images
  - name: Videos
  - name: Audio
  - name: Platform
paths:
  /v1/models:
    get:
      tags: [Platform]
      operationId: listModels
      summary: List models
      responses:
        '200':
          description: Enabled models available to the current API key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelList' }
  /v1/chat/completions:
    post:
      tags: [Chat & Text]
      operationId: createChatCompletion
      summary: Create a chat completion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCompletionRequest' }
      responses:
        '200':
          description: Chat completion or an SSE stream when stream=true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatCompletion' }
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Error' }
  /v1/messages:
    post:
      security:
        - anthropicApiKey: []
      tags: [Chat & Text]
      operationId: createAnthropicMessage
      summary: Create a native Anthropic message
      description: Anthropic Messages-compatible request and response shape. The platform resolves the model and provider internally.
      parameters:
        - { name: anthropic-version, in: header, required: false, schema: { type: string, default: '2023-06-01' } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/AnthropicMessageRequest' } }
      responses:
        '200': { description: Anthropic message response, content: { application/json: { schema: { $ref: '#/components/schemas/AnthropicMessage' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1beta/models/{model}:generateContent:
    post:
      security:
        - geminiApiKey: []
      tags: [Chat & Text]
      operationId: generateGeminiContent
      summary: Generate content using the native Gemini API
      parameters:
        - { name: model, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GeminiGenerateContentRequest' } }
      responses:
        '200': { description: Gemini candidates response, content: { application/json: { schema: { $ref: '#/components/schemas/GeminiGenerateContentResponse' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1beta/models/{model}:streamGenerateContent:
    post:
      security:
        - geminiApiKey: []
      tags: [Chat & Text]
      operationId: streamGeminiContent
      summary: Stream content using the native Gemini API
      parameters:
        - { name: model, in: path, required: true, schema: { type: string } }
        - { name: alt, in: query, required: false, schema: { type: string, enum: [sse] } }
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/GeminiGenerateContentRequest' } }
      responses:
        '200': { description: Server-sent Gemini GenerateContentResponse objects, content: { text/event-stream: { schema: { type: string } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/images/generations:
    post:
      tags: [Images]
      operationId: createImageGeneration
      summary: Generate images
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/ImageGenerationRequest' } }
      responses:
        '200': { description: Task information, or generated URLs when synchronous waiting succeeds., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Task' }, { $ref: '#/components/schemas/MediaGenerationResult' }] } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/video/generations:
    post:
      tags: [Videos]
      operationId: createVideoGeneration
      summary: Start a video generation task
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/MediaTaskRequest' } }
      responses:
        '200': { description: Task information, or generated URLs when synchronous waiting succeeds., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Task' }, { $ref: '#/components/schemas/MediaGenerationResult' }] } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/audio/speech:
    post:
      tags: [Audio]
      operationId: createSpeech
      summary: Generate speech or music audio
      requestBody:
        required: true
        content:
          application/json: { schema: { $ref: '#/components/schemas/SpeechRequest' } }
      responses:
        '200': { description: Task information, or generated URLs when synchronous waiting succeeds., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/Task' }, { $ref: '#/components/schemas/MediaGenerationResult' }] } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/tasks/{task_no}:
    get:
      tags: [Platform]
      operationId: getTask
      summary: Retrieve a task
      parameters:
        - { name: task_no, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Task status, content: { application/json: { schema: { $ref: '#/components/schemas/Task' } } } }
        default: { $ref: '#/components/responses/Error' }
  /v1/tasks/{task_no}/events:
    get:
      tags: [Platform]
      operationId: listTaskEvents
      summary: List task progress events
      parameters:
        - { name: task_no, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Task events, content: { application/json: { schema: { $ref: '#/components/schemas/TaskEvents' } } } }
        default: { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API_KEY
    anthropicApiKey:
      type: apiKey
      in: header
      name: x-api-key
    geminiApiKey:
      type: apiKey
      in: header
      name: x-goog-api-key
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string, description: Platform model code }
        messages: { type: array, items: { type: object, required: [role, content], properties: { role: { type: string, enum: [system, user, assistant, tool] }, content: {} } } }
        stream: { type: boolean, default: false }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1 }
        tools: { type: array, items: { type: object } }
    ChatCompletion:
      type: object
      required: [id, object, choices]
      properties:
        id: { type: string }
        object: { type: string, const: chat.completion }
        model: { type: string }
        choices: { type: array, items: { type: object } }
        usage: { type: object }
    AnthropicMessageRequest:
      type: object
      required: [model, max_tokens, messages]
      properties:
        model: { type: string }
        max_tokens: { type: integer, minimum: 1 }
        system: {}
        messages: { type: array, items: { type: object, required: [role, content], properties: { role: { type: string, enum: [user, assistant] }, content: {} } } }
        stream: { type: boolean, default: false }
        temperature: { type: number }
        top_p: { type: number }
        tools: { type: array, items: { type: object } }
    AnthropicMessage:
      type: object
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        content: { type: array, items: { type: object } }
        model: { type: string }
        stop_reason: { type: string }
        usage: { type: object }
    GeminiGenerateContentRequest:
      type: object
      required: [contents]
      properties:
        contents: { type: array, items: { type: object, required: [parts], properties: { role: { type: string, enum: [user, model] }, parts: { type: array, items: { type: object } } } } }
        systemInstruction: { type: object }
        generationConfig: { type: object }
        tools: { type: array, items: { type: object } }
    GeminiGenerateContentResponse:
      type: object
      properties:
        candidates: { type: array, items: { type: object } }
        usageMetadata: { type: object }
    ImageGenerationRequest:
      type: object
      required: [model, prompt]
      properties:
        model: { type: string }
        prompt: { type: string }
        n: { type: integer, minimum: 1, description: Provider-specific limit; Qwen Image 3.0 accepts 1-6 and other models use the selected model's schema. }
        count: { type: integer, minimum: 1, description: Alias for n. }
        size: { type: string, description: 'Exact width*height or widthxheight. Qwen Image 3.0 accepts 512*512 through 2048*2048; omit for automatic sizing.' }
        quality: { type: string }
        response_format: { type: string, enum: [async, sync], default: async }
        wait: { type: boolean, default: false, description: Wait for completion when the model poll budget is at most 10 minutes. }
        aspect_ratio: { type: string }
        image_size: { type: string }
        image: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        images: { type: array, items: { type: string }, description: Alias for reference_images. }
        image_url: { type: string, description: Single-image alias for reference_images. }
        reference_image: { type: string, description: Single-item alias for reference_images. }
        reference_images: { type: array, items: { type: string }, description: Provider-specific reference image list. Qwen Image 3.0 accepts 1-3; other models use the selected model's documented limit. }
        prompt_extend: { type: boolean }
        prompt_extend_mode: { type: string, enum: [direct, agent], description: Agent mode is text-to-image only; reference-image requests use direct mode. }
        enable_thinking: { type: boolean }
        negative_prompt: { type: string }
        seed: { type: integer, minimum: 0, maximum: 2147483647 }
        watermark: { type: boolean }
    MediaTaskRequest:
      type: object
      required: [model]
      properties:
        model: { type: string }
        prompt: { type: string, description: Required for text, reference and editing modes; optional for HappyHorse first-frame generation. }
        n: { type: integer, minimum: 1, description: Alias for count. }
        count: { type: integer, minimum: 1, description: Number of outputs when supported by the selected model. }
        generation_mode: { type: string, description: Provider-specific mode. Common values include text, first_frame, last_frame, first_last, reference and Seedance media combinations. It is inferred from supplied media when omitted for supported templates. }
        resolution: { type: string, description: Provider-specific resolution such as 480P, 720P, 1080P, 720p or 2K. }
        ratio: { type: string }
        audio: { type: boolean }
        audio_setting: { type: string, enum: [auto, origin] }
        prompt_extend: { type: boolean }
        watermark: { type: boolean }
        seed: { type: integer, minimum: 0, maximum: 2147483647 }
        size: { type: string }
        duration: { oneOf: [{ type: number }, { type: string }] }
        duration_seconds: { oneOf: [{ type: number }, { type: string }], description: Alias for duration. }
        mode: { type: string, description: Alias for generation_mode. When omitted, the platform infers the mode from supplied media for supported templates. }
        orientation: { type: string, enum: [portrait, landscape] }
        aspect_ratio: { type: string }
        image: { oneOf: [{ type: string }, { type: array, items: { type: string } }], description: Compatibility alias. Maps to first_frame for first-frame templates and to reference_images for reference templates. A two-item array maps to first_frame and last_frame for frame-pair templates. }
        images: { type: array, items: { type: string }, description: Alias for image/reference_images. }
        image_url: { type: string, description: Single-image alias. }
        first_frame: { type: string }
        last_frame: { type: string }
        first_frame_image: { type: string, description: Alias for first_frame. }
        last_frame_image: { type: string, description: Alias for last_frame. }
        reference_image: { type: string, description: Single-item alias for reference_images. }
        reference_images: { type: array, items: { type: string } }
        reference_video: { type: string, format: uri, description: Single-item alias for reference_videos. }
        reference_videos: { type: array, items: { type: string, format: uri }, description: Must be publicly reachable by the upstream provider. HappyHorse editing requires exactly one. }
        reference_audio: { type: string, format: uri, description: Single-item alias for reference_audios. }
        reference_audios: { type: array, items: { type: string, format: uri }, description: Must be publicly reachable by the upstream provider. }
        response_format: { type: string, enum: [async, sync], default: async }
        wait: { type: boolean, default: false, description: Wait when the configured model poll budget is at most 10 minutes; otherwise an async task is returned. }
    SpeechRequest:
      type: object
      required: [model]
      properties:
        model: { type: string }
        input: { type: string, description: TTS text or the model's primary music input. For MiniMax Music 3.0 / 2.6 this is lyrics; it may be empty only when the selected model and music mode allow it. }
        voice: { type: string }
        voice_id: { type: string, description: Provider-native voice identifier. The generic voice field is automatically mapped when the selected model expects voice_id. }
        format: { type: string, enum: [mp3, opus, aac, flac, wav, pcm] }
        sample_rate: { type: integer }
        instruction: { type: string, description: Qwen-Audio-TTS and CosyVoice expression instruction where supported by the selected model and voice. }
        lyrics: { type: string, description: Custom lyrics. Fun-Music accepts it without input; music templates configured with lyrics as their primary upstream field also accept it as an input alias. }
        music_prompt: { type: string, description: Music style, mood or arrangement prompt for supported music models. }
        n: { type: integer, minimum: 1, description: Alias for count. }
        count: { type: integer, minimum: 1, description: Number of outputs when supported by the selected model. }
        gender: { type: string, enum: [female, male] }
        is_instrumental: { type: boolean }
        lyrics_optimizer: { type: boolean, description: MiniMax Music 3.0 / 2.6 can generate lyrics from music_prompt when input is empty. }
        output_format: { type: string, enum: [hex, url], description: Provider-native output transport when supported; the platform persists the result and returns a URL. }
        aigc_watermark: { type: boolean }
        response_format: { type: string, enum: [async, sync], default: async }
        wait: { type: boolean, default: false, description: Wait when the configured model poll budget is at most 10 minutes; otherwise an async task is returned. }
    Task:
      type: object
      required: [task_no, status]
      properties:
        task_no: { type: string }
        type: { type: string, enum: [image, video, audio] }
        status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        model_code: { type: string }
        estimated_cost: { type: number }
        created_at: { type: string, format: date-time }
        poll_url: { type: string }
        upstream_task_id: { type: string }
        output: {}
        error_code: { type: string }
        error_message: { type: string }
    MediaGenerationResult:
      type: object
      required: [created, data]
      properties:
        created: { type: integer, format: int64 }
        data:
          type: array
          items:
            type: object
            required: [url]
            properties:
              url: { type: string }
    TaskEvents:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              progress: { type: number }
              created_at: { type: string, format: date-time }
              payload: {}
    ModelList:
      type: object
      properties:
        object: { type: string, const: list }
        data: { type: array, items: { type: object, properties: { id: { type: string }, object: { type: string }, owned_by: { type: string } } } }
    Error:
      type: object
      properties:
        error: { type: object, properties: { code: { type: string }, message: { type: string }, type: { type: string }, request_id: { type: string } } }
